<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Claude2Antigravity: your Claude skills, plugins, agents and conversations, live in Google Antigravity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151B33"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C8DF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4C8DF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#4C8DF6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>

  <!-- Claude side -->
  <circle cx="230" cy="190" r="150" fill="url(#glowL)"/>
  <circle cx="230" cy="190" r="74" fill="#1C1410" stroke="#D97757" stroke-width="3"/>
  <g transform="translate(230 190)" stroke="#D97757" stroke-width="9" stroke-linecap="round">
    <line x1="0" y1="-38" x2="0" y2="38"/>
    <line x1="-38" y1="0" x2="38" y2="0"/>
    <line x1="-27" y1="-27" x2="27" y2="27"/>
    <line x1="-27" y1="27" x2="27" y2="-27"/>
  </g>
  <text x="230" y="312" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#F3D2C4">Claude Code</text>

  <!-- Antigravity side -->
  <circle cx="970" cy="190" r="150" fill="url(#glowR)"/>
  <circle cx="970" cy="190" r="74" fill="#0E1426" stroke="#4C8DF6" stroke-width="3"/>
  <path d="M970 140 L1012 228 H992 L970 178 L948 228 H928 Z" fill="#4C8DF6"/>
  <text x="970" y="312" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#CFE0FF">Google Antigravity</text>

  <!-- flow between them -->
  <g fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round">
    <path d="M318 160 C 470 110, 730 110, 882 160"/>
    <path d="M318 220 C 470 270, 730 270, 882 220" stroke-dasharray="2 12"/>
  </g>
  <path d="M870 148 L888 162 L866 170" fill="none" stroke="#4C8DF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#C7CBD4" text-anchor="middle">
    <rect x="452" y="120" width="96" height="30" rx="15" fill="#1E2540" stroke="#3A4466"/><text x="500" y="140">skills</text>
    <rect x="558" y="112" width="96" height="30" rx="15" fill="#1E2540" stroke="#3A4466"/><text x="606" y="132">plugins</text>
    <rect x="664" y="120" width="96" height="30" rx="15" fill="#1E2540" stroke="#3A4466"/><text x="712" y="140">agents</text>
    <rect x="474" y="236" width="104" height="30" rx="15" fill="#1E2540" stroke="#3A4466"/><text x="526" y="256">MCP servers</text>
    <rect x="588" y="244" width="140" height="30" rx="15" fill="#1E2540" stroke="#3A4466"/><text x="658" y="264">conversations</text>
  </g>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="196" font-size="44" font-weight="800" fill="#FFFFFF">Claude2Antigravity</text>
    <text x="600" y="226" font-size="17" fill="#A9B1C6">live in about 1 second · 100% on your computer</text>
  </g>
  <text x="600" y="380" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#E5E7EB">Hit your Claude usage limit? Keep working in Antigravity - with everything you had.</text>
</svg>
