name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: Container image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from pyproject.toml
        id: v
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hassenchaaben/claude2antigravity:${{ steps.v.outputs.version }}
            ghcr.io/hassenchaaben/claude2antigravity:latest
      - name: Smoke test
        run: docker run --rm ghcr.io/hassenchaaben/claude2antigravity:latest --version

  pypi:
    name: Python package (PyPI)
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Upload to PyPI (only when the PYPI_API_TOKEN secret is set)
        if: env.PYPI_API_TOKEN != ''
        run: python -m twine upload dist/* -u __token__ -p "$PYPI_API_TOKEN"
